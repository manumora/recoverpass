# Configuración del kiosco de recuperación de contraseña.
#
# Lo leen /usr/bin/recoverpass-session y /usr/bin/recoverpass-update-policy.
# Es un fragmento de shell: sin espacios alrededor del «=» y con las cadenas
# entrecomilladas.
#
# DESPUÉS DE CAMBIAR CUALQUIER COSA AQUÍ, REGENERE LAS POLÍTICAS:
#
#     sudo recoverpass-update-policy
#
# ---------------------------------------------------------------------------

# URL del portal de autoservicio de contraseñas.
#
# ATENCIÓN: mientras siga siendo el valor de ejemplo, el kiosco no sirve para
# nada. Cámbielo por la URL real antes de desplegar.
PORTAL_URL="https://sspr.example.local"

# Dominios adicionales que el portal necesita cargar: CDN, tipografías,
# reCAPTCHA, proveedor de identidad externo... Separados por espacios.
#
# NO hace falta repetir aquí el dominio de PORTAL_URL: su host se permite
# entero de forma automática, con lo que el portal carga sus propios JS, CSS e
# imágenes sin más.
#
# Todo lo que no esté aquí ni en PORTAL_URL queda bloqueado por las políticas
# del navegador y la página se verá rota. Averigüe la lista abriendo el portal
# en un equipo normal con la consola de red del navegador.
#
# Añadir aquí el webmail es una decisión consciente, no un descuido: convierte
# el kiosco sin contraseña en una pantalla de acceso al correo para cualquiera
# que pase por delante. Lo habitual es no hacerlo y avisar en la barra inferior
# de que el código se lee desde el móvil.
ALLOWED_DOMAINS=""

# Segundos que dura la sesión antes de cerrarse sola.
TIMEOUT=900

# Distribución de teclado de la sesión kiosco (setxkbmap).
KEYBOARD_LAYOUT="es"

# Altura en píxeles de la barra inferior con el botón «Salir».
#
# Es orientativa: yad ajusta la ventana a su contenido, así que con la barra
# vacía queda en unos 40 px, poco más que el propio botón.
BAR_HEIGHT=44

# Mensaje opcional en la barra inferior. Vacío por defecto: el botón «Salir»
# se explica solo y así la barra ocupa lo mínimo.
#
# Si se rellena, la barra crece con el texto (una frase corta la deja en unos
# 130 px) y el botón deja de estar centrado a lo ancho de la pantalla.
BAR_TEXT=""

# Hoja de estilo de la barra inferior: tamaño del botón «Salir», tipografía y
# margen con el borde de la pantalla. Se copia a la sesión del kiosco en cada
# arranque, porque yad no admite CSS por línea de órdenes.
BAR_CSS="/usr/share/recoverpass/barra.css"

# Navegador del kiosco. Valores admitidos:
#
#   chromium-browser  El paquete de Ubuntu 22.04. Desde 20.04 no es un
#                     navegador de verdad, sino un paquete de transición que
#                     lanza el snap de Chromium: el binario está en
#                     /usr/bin/chromium-browser, pero si el snap no está
#                     instalado arranca y muere al instante. Compruébelo con
#                     «snap list chromium».
#   chromium          El mismo navegador cuando el binario se llama así
#                     (Ubuntu 24.04 y snap directo, /snap/bin/chromium).
#   google-chrome     Google Chrome instalado desde el .deb de Google.
#
# Se busca primero el nombre indicado aquí y, si no aparece, los otros de la
# misma familia; los valores «chromium» y «chromium-browser» son por tanto
# intercambiables en la práctica.
#
# Chromium es preferible a Google Chrome porque sus políticas restrictivas se
# quedan en él: quien navegue con Chrome en el mismo equipo no se ve afectado.
# Las de Chrome son globales para TODOS los usuarios de la máquina.
#
# Recuerde que el snap sólo arranca si $HOME está en una ruta declarada en
# «snap set system homedirs», cosa de la que se encarga el paquete al
# instalarse, porque el home del kiosco está en /var/lib.
BROWSER="chromium-browser"

# Directorio de políticas gestionadas del navegador elegido:
#
#   chromium-browser  /etc/chromium-browser/policies/managed
#   chromium          /etc/chromium-browser/policies/managed
#   google-chrome     /etc/opt/chrome/policies/managed
POLICY_DIR="/etc/chromium-browser/policies/managed"

# Certificado de la CA que firma el portal, en formato PEM.
#
# Si el portal usa un certificado autofirmado o de una CA propia, el navegador
# mostraría «La conexión no es privada» y el kiosco no serviría de nada. Con
# esto se importa la CA en el almacén del navegador al arrancar la sesión, y
# el certificado se valida de verdad.
#
#   CA_CERT="/usr/local/share/ca-certificates/micentro.crt"
#
# TIENE PRIORIDAD sobre IGNORE_CERT_ERRORS: si se rellena y la CA se importa
# bien, la validación NO se desactiva.
CA_CERT=""

# Saltarse la validación del certificado del portal.
#
# Viene activado para que el kiosco funcione de entrada con un certificado
# autofirmado. Es cómodo, pero la sesión no comprueba la identidad del
# servidor: en cuanto pueda, rellene CA_CERT con la CA del centro, que
# desactiva esto automáticamente.
#
# También se usa como red de seguridad si CA_CERT está puesto pero su
# importación falla, para no dejar el kiosco inservible.
IGNORE_CERT_ERRORS="true"

# ---------------------------------------------------------------------------
# APARIENCIA DE LA PANTALLA DE ACCESO (el greeter)
#
# DESPUÉS DE CAMBIAR CUALQUIER COSA DE AQUÍ:
#
#     sudo recoverpass-update-theme
#
# El tema del greeter es una página web servida a web-greeter y no lee este
# fichero: la configuración se le pasa generando su config.js con esa orden.
# ---------------------------------------------------------------------------

# Imagen de fondo de la pantalla de acceso.
#
# Se escala para cubrir la pantalla sin deformarse. Déjelo vacío para un fondo
# liso del color secundario.
#
# El paquete trae otra imagen alternativa en la misma carpeta, por si se
# prefiere:
#
#   BACKGROUND_IMAGE="/usr/share/recoverpass/background_linex.png"
BACKGROUND_IMAGE="/usr/share/recoverpass/background.png"

# Color principal: botón de acceso, foco del teclado y detalles destacados.
PRIMARY_COLOR="#1565C0"

# Color secundario: el del panel y el fondo liso.
#
# El resto de la paleta se deriva de él: si es claro, los textos y los bordes
# se oscurecen solos; si es oscuro, se aclaran. Así se puede poner blanco o
# negro sin que nada quede ilegible.
SECONDARY_COLOR="#FFFFFF"

# Nombre del centro, que se muestra bajo la fecha y sobre el nombre del equipo.
# Déjelo vacío para no mostrar nada.
CENTER_NAME="IES Santa Eulalia"

# Botones de la barra inferior. Suspender viene oculto porque en un equipo de
# aula suele dar más problemas que utilidad. Los tres piden confirmación antes
# de actuar.
SHOW_SUSPEND="false"
SHOW_RESTART="true"
SHOW_SHUTDOWN="true"

# Desplegable para elegir el tipo de sesión (Xfce, GNOME...) en la barra
# inferior. Ocúltelo si en el parque siempre se entra a la misma.
SHOW_SESSION="true"

# Zona horaria del reloj de la pantalla de acceso.
#
# Se fija aquí a propósito: la sesión del greeter no siempre hereda la del
# sistema y el reloj puede aparecer desplazado unas horas.
TIMEZONE="Europe/Madrid"
